<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | JMprint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { display: ['"Space Grotesk"', 'sans-serif'], body: ['"DM Sans"', 'sans-serif'] }, colors: { ink: '#101828', cyanx: '#087f8c', yellowx: '#ffd447', paper: '#f7f8f5' } } } };</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-paper text-ink font-body">
    <header data-site-header></header>
    <main>
        <section class="page-hero page-hero-contact">
            <div class="mx-auto max-w-7xl">
                <p class="eyebrow text-yellowx">Start something good</p>
                <h1
                    class="mt-5 max-w-4xl font-display text-6xl font-semibold leading-none tracking-[-.06em] sm:text-8xl">
                    Let’s make<br>it tangible.</h1>
            </div>
        </section>
        <section class="mx-auto grid max-w-7xl gap-16 px-6 py-24 lg:grid-cols-[1.1fr_.9fr] lg:px-10">
            <div>
                <p class="eyebrow text-cyanx">Your brief</p>
                <h2 class="section-title mt-3">Tell us what<br>you’re making.</h2>
                <form class="mt-10 grid gap-5" action="/api/contact" method="POST">
                    <div class="grid gap-5 sm:grid-cols-2"><label class="grid gap-2 text-sm font-semibold">Name<input
                                class="input" type="text" name="name" required placeholder="Your name"></label><label
                            class="grid gap-2 text-sm font-semibold">Email<input class="input" type="email" name="email"
                                required placeholder="you@company.com"></label></div>
                    <div class="grid gap-5 sm:grid-cols-2"><label class="grid gap-2 text-sm font-semibold">Phone<input
                                class="input" type="tel" name="phone" placeholder="+20 ..."></label><label
                            class="grid gap-2 text-sm font-semibold">Service<select class="input" name="service"
                                required>
                                <option value="">Choose one</option>
                                <option>Digital printing</option>
                                <option>Offset printing</option>
                                <option>Large format</option>
                                <option>Packaging</option>
                                <option>Not sure yet</option>
                            </select></label></div><label class="grid gap-2 text-sm font-semibold">Message<textarea
                            class="input min-h-36" name="message" required
                            placeholder="A little about the project, quantity, and timeline..."></textarea></label><button
                        class="button button-yellow w-fit" type="submit">Send inquiry <span>↗</span></button>
                </form>
            </div>
            <aside class="lg:pt-16">
                <div class="overflow-hidden border border-ink/10 bg-white"><iframe title="Map showing JMprint in Giza"
                        class="h-72 w-full grayscale"
                        src="https://www.openstreetmap.org/export/embed.html?bbox=31.15%2C29.96%2C31.28%2C30.08&layer=mapnik&marker=30.0131%2C31.2089"></iframe>
                    <div class="grid gap-7 p-7 sm:grid-cols-2 lg:grid-cols-1">
                        <div>
                            <p class="eyebrow text-cyanx">Find us</p>
                            <p class="mt-3 leading-6 text-slate-600"> Tawabek<br>Giza, Egypt</p>
                        </div>
                        <div>
                            <p class="eyebrow text-cyanx">Hours</p>
                            <p class="mt-3 leading-6 text-slate-600">Saturday–Thursday<br>9:00 AM – 6:00 PM</p>
                        </div>
                        <div>
                            <p class="eyebrow text-cyanx">Reach out</p>
                            <p class="mt-3 leading-6 text-slate-600"><a
                                    href="mailto:jimmy.mounir@gmail.com">jimmy.mounir@gmail.com</a><br><a
                                    href="tel:+2012881288">+20 12 881288</a></p>
                        </div>
                    </div>
                </div>
            </aside>
        </section>
    </main>
    <footer data-site-footer></footer>
    <script src="app.js"></script>
</body>

</html>
